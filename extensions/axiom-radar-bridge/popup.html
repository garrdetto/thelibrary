<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Axiom Radar Bridge</title>
<style>
  body { font: 13px/1.5 system-ui, sans-serif; width: 300px; margin: 0; padding: 14px; color: #222; background: #fafafa; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  p { margin: 6px 0; }
  .ok { color: #1f7a45; } .bad { color: #b3261e; } .muted { color: #666; font-size: 12px; }
  label { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  input { width: 80px; padding: 4px 6px; }
  @media (prefers-color-scheme: dark) { body { background: #1e1f22; color: #e6e6e6; } .muted { color: #9a9a9a; } .ok { color: #6fcf97; } .bad { color: #f28b82; } }
</style>
</head>
<body>
<h1>Axiom Radar Bridge</h1>
<p id="status" class="muted">Checking…</p>
<p id="tracked" class="muted"></p>
<p class="muted">Open axiom.trade (Pulse or a token page) in this browser. Counts are sent every 5 seconds while the tab is open.</p>
<label>Tracker port <input id="port" type="number" min="1" max="65535"></label>
<script src="popup.js"></script>
</body>
</html>
