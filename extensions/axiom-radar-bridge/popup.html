<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Axiom Radar Bridge</title>
<style>
  body { font: 13px/1.5 system-ui, sans-serif; width: 300px; margin: 0; padding: 14px; color: #222; background: #fafafa; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  p { margin: 6px 0; }
  .ok { color: #1f7a45; } .bad { color: #b3261e; } .muted { color: #666; font-size: 12px; }
  label { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  input { width: 80px; padding: 4px 6px; }
  .field { display: grid; gap: 2px; margin-top: 8px; }
  .field input { width: 100%; box-sizing: border-box; }
  button { margin-top: 8px; padding: 6px 10px; cursor: pointer; }
  @media (prefers-color-scheme: dark) { body { background: #1e1f22; color: #e6e6e6; } .muted { color: #9a9a9a; } .ok { color: #6fcf97; } .bad { color: #f28b82; } }
</style>
</head>
<body>
<h1>Axiom Radar Bridge</h1>
<p id="status" class="muted">Checking…</p>
<p id="tracked" class="muted"></p>
<p class="muted">Keep axiom.trade/pulse open in this browser. Counts are sent every second and keep flowing while the tab is in the background. For a window you never have to touch, start it with <code>pnpm axiom:chrome</code>.</p>
<label><input id="cycle" type="checkbox" style="width:auto"> Fill in missing viewers and holder figures by visiting each coin's Axiom page in one background tab</label>
<p id="missing" class="muted"></p>
<label><input id="watch" type="checkbox" style="width:auto"> Keep the Radar's picks on my Axiom watchlist (stars and un-stars them on their coin pages; your own stars are left alone)</label>
<p id="watch-status" class="muted"></p>
<button id="sample" type="button">Send diagnostic sample</button>
<p id="sample-status" class="muted"></p>
<label class="field">Tracker address (a port number for this computer, or your server's https address) <input id="address" type="text" spellcheck="false" autocomplete="off" placeholder="8791 or https://your-tracker.example"></label>
<label class="field">Server key (AXIOM_BRIDGE_KEY; leave empty for this computer) <input id="key" type="password" autocomplete="off"></label>
<button id="save" type="button">Save</button>
<p id="save-status" class="muted"></p>
<script src="popup.js"></script>
</body>
</html>
