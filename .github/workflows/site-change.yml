name: Site change (Claude)

run-name: Site change ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Site change id from the admin panel
        required: true
      callback_url:
        description: The site's /api/site-changes endpoint
        required: true
      runner:
        description: Where to run (github, or laptop for the self-hosted runner on the admin's laptop)
        required: false
        default: github
        type: choice
        options: [github, laptop]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: site-change
  cancel-in-progress: false

jobs:
  change:
    # "laptop" runs on the self-hosted runner set up with scripts/laptop-runner/
    # (label from the SITE_CHANGES_RUNNER_LABEL repository variable, default msi-laptop).
    runs-on: ${{ inputs.runner == 'laptop' && (vars.SITE_CHANGES_RUNNER_LABEL || 'msi-laptop') || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      JOB_ID: ${{ inputs.job_id }}
      CALLBACK_URL: ${{ inputs.callback_url }}
      SITE_CHANGES_SECRET: ${{ secrets.SITE_CHANGES_SECRET }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50
          persist-credentials: false

      - name: Check laptop tools
        if: runner.environment == 'self-hosted'
        run: |
          for tool in git gh curl; do
            command -v "$tool" >/dev/null || { echo "::error::$tool is missing on the laptop runner. Run scripts/laptop-runner/setup.sh again."; exit 1; }
          done
          if command -v blender >/dev/null || [ -x "$HOME/blender/blender" ]; then
            echo "Blender: $({ command -v blender >/dev/null && blender --version || "$HOME/blender/blender" --version; } 2>/dev/null | head -1)"
          else
            echo "::notice::Blender isn't installed on the laptop, so Meshy models skip the clean-up step. Run scripts/laptop-runner/install-blender.sh to add it."
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies and Claude Code
        run: |
          pnpm install --no-frozen-lockfile
          npm install -g @anthropic-ai/claude-code

      # On GitHub, Claude uses the API key (or subscription token) secret. On the
      # laptop it uses the Claude account signed in there instead (`claude` → /login).
      - name: Ask Claude
        env:
          ANTHROPIC_API_KEY: ${{ runner.environment != 'self-hosted' && secrets.ANTHROPIC_API_KEY || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ runner.environment != 'self-hosted' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          SITE_CHANGES_LOCAL_LOGIN: ${{ runner.environment == 'self-hosted' && '1' || '' }}
          SITE_CHANGES_MODEL: ${{ vars.SITE_CHANGES_MODEL }}
          # 3D models: scripts/meshy-generate.mjs reads these. MESHY_MAX_CREDITS caps one model's estimate.
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
          MESHY_MAX_CREDITS: ${{ vars.MESHY_MAX_CREDITS || '150' }}
        run: node .github/site-changes/run.mjs claude

      # A pull request opened with the built-in GITHUB_TOKEN never starts other
      # workflows, so the `modules` check (and auto-merge) needs a personal token:
      # the CLAUDE_GITHUB_TOKEN repository secret, when it exists.
      - name: Build and open a pull request
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_GITHUB_TOKEN || github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/site-changes/run.mjs publish

      - name: Report failure
        if: failure() || cancelled()
        run: node .github/site-changes/run.mjs failed

      # A self-hosted runner keeps its working copy between runs, so never leave
      # the push token in its git config.
      - name: Remove credentials from the laptop's checkout
        if: always() && runner.environment == 'self-hosted'
        run: git remote set-url origin "https://github.com/${{ github.repository }}.git" || true
