name: Site change (Claude)

run-name: Site change ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Site change id from the admin panel
        required: true
      callback_url:
        description: The site's /api/site-changes endpoint
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: site-change
  cancel-in-progress: false

jobs:
  change:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JOB_ID: ${{ inputs.job_id }}
      CALLBACK_URL: ${{ inputs.callback_url }}
      SITE_CHANGES_SECRET: ${{ secrets.SITE_CHANGES_SECRET }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies and Claude Code
        run: |
          pnpm install --no-frozen-lockfile
          npm install -g @anthropic-ai/claude-code

      - name: Ask Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SITE_CHANGES_MODEL: ${{ vars.SITE_CHANGES_MODEL }}
        run: node .github/site-changes/run.mjs claude

      # A pull request opened with the built-in GITHUB_TOKEN never starts other
      # workflows, so the `modules` check (and auto-merge) needs a personal token:
      # the CLAUDE_GITHUB_TOKEN repository secret, when it exists.
      - name: Build and open a pull request
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_GITHUB_TOKEN || github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/site-changes/run.mjs publish

      - name: Report failure
        if: failure() || cancelled()
        run: node .github/site-changes/run.mjs failed
