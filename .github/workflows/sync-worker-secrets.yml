name: Sync Worker secrets

# Copies AI keys that already live in this repository's secrets onto the site Worker, so the
# studios (AI Chat, Image Studio, Lyric Studio, Voice Generator) can use them. Values go straight
# from GitHub to Cloudflare and are never printed. Keys that aren't set here are skipped, never
# blanked. Runs when this file changes on main, or from the Actions tab (Run workflow).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/sync-worker-secrets.yml]

permissions:
  contents: read

concurrency:
  group: sync-worker-secrets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets are required."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copy keys to the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          set -euo pipefail
          copied=0
          for name in ANTHROPIC_API_KEY GEMINI_API_KEY ELEVENLABS_API_KEY; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "$name is not a repository secret; left the Worker's value as it is."
              continue
            fi
            printf '%s' "$value" | npx --yes wrangler@latest secret put "$name" > /dev/null
            echo "Copied $name to the Worker."
            copied=$((copied + 1))
          done
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::The ANTHROPIC_API_KEY repository secret is missing, so AI Chat and the Lyric Studio still have no Claude key."
            exit 1
          fi
          echo "$copied key(s) copied."
