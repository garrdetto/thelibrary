name: modules

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  modules:
    name: modules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore built models
        uses: actions/cache@v4
        with:
          path: public/models
          key: models-${{ hashFiles('assets-src/**', 'scripts/assets.mjs') }}

      - name: Assets
        run: pnpm assets

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Performance baseline
        run: |
          if [ -f scripts/perf-baseline.mjs ]; then
            node scripts/perf-baseline.mjs --check
          else
            echo "scripts/perf-baseline.mjs not present yet; skipping"
          fi
