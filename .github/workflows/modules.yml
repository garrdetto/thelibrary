name: modules

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Assets
        run: pnpm assets:check

      - name: Build
        run: pnpm build

      - name: Performance baseline
        run: |
          if [ -f scripts/perf-baseline.mjs ]; then
            node scripts/perf-baseline.mjs --check
          else
            echo "scripts/perf-baseline.mjs not present yet; skipping"
          fi

  test:
    name: test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test:${{ matrix.shard }}

  modules:
    name: modules
    runs-on: ubuntu-latest
    needs: [build, test]
    if: always()
    steps:
      - name: Result
        run: |
          echo "build: ${{ needs.build.result }}, tests: ${{ needs.test.result }}"
          test "${{ needs.build.result }}" = success && test "${{ needs.test.result }}" = success
