<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Vector Arena · the library</title>
    <style>
      :root{--hud:#cfe6ff;--hud-dim:rgba(207,230,255,.35);--hud-glow:rgba(120,180,255,.55);--panel:rgba(8,18,30,.55);--warn:#ff6a55;--ally:#ffe078}
      html,body{margin:0;height:100%;background:#b3c7da;color:var(--hud);overflow:hidden;font-family:Bahnschrift,"DIN Alternate","Segoe UI",system-ui,sans-serif}
      #stage{position:relative;width:100%;height:100%}
      #stage canvas#view{display:block;width:100%;height:100%;outline:none;touch-action:none}
      .hud{position:absolute;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.7)}
      #hud{left:16px;top:14px}
      #hud h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.22em;text-transform:uppercase}
      #hud p{margin:4px 0 0;font-size:12px;opacity:.8}
      body.locked #hud p{display:none}
      #vitals{left:50%;top:16px;width:min(360px,60vw);transform:translateX(-50%)}
      #vitals .label{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.85}
      .bar{position:relative;height:10px;margin-top:4px;background:var(--panel);border:1px solid var(--hud-dim);clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
      .bar div{height:100%;transform-origin:left center;background:linear-gradient(180deg,#e6f3ff,#7fb4ff);box-shadow:0 0 10px var(--hud-glow)}
      #health-fill{-webkit-mask:repeating-linear-gradient(90deg,#000 0 calc(10% - 2px),transparent calc(10% - 2px) 10%);mask:repeating-linear-gradient(90deg,#000 0 calc(10% - 2px),transparent calc(10% - 2px) 10%)}
      .bar div.low{background:linear-gradient(180deg,#ffb3a6,var(--warn))}
      #arsenal{right:16px;top:14px;min-width:180px;text-align:right}
      #weapon-name{font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.85}
      #weapon-ammo{font-size:30px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
      #weapon-ammo.low{color:var(--warn)}
      #weapon-rounds{--share:1;--magazine:32;position:relative;width:170px;height:12px;margin:4px 0 0 auto}
      #weapon-rounds::before,#weapon-rounds::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,currentColor 0 calc(100% / var(--magazine) - 2px),transparent calc(100% / var(--magazine) - 2px) calc(100% / var(--magazine)))}
      #weapon-rounds::before{opacity:.22}
      #weapon-rounds::after{clip-path:inset(0 calc((1 - var(--share)) * 100%) 0 0)}
      #arsenal .bar{width:170px;margin-left:auto;height:4px}
      #arsenal .bar div{transform:scaleX(0)}
      #arsenal small{display:block;font-size:11px;opacity:.65;margin-top:6px}
      #tracker{left:16px;bottom:16px;width:150px;height:150px}
      #killfeed{left:16px;bottom:178px;font-size:13px}
      #killfeed div{background:var(--panel);padding:4px 10px;margin-top:4px;border-left:2px solid var(--hud)}
      #status{right:16px;bottom:16px;font-size:12px;letter-spacing:.08em;opacity:.85}
      #crosshair{--gap:6px;left:50%;top:50%;width:0;height:0;opacity:0;transition:opacity .2s}
      #crosshair::before{content:"";position:absolute;left:calc(-1 * var(--gap) - 4px);top:calc(-1 * var(--gap) - 4px);width:calc(2 * var(--gap) + 8px);height:calc(2 * var(--gap) + 8px);border:1.5px solid var(--hud);border-radius:50%;box-shadow:0 0 4px rgba(0,0,0,.6);box-sizing:border-box;opacity:.75}
      #crosshair::after{content:"";position:absolute;left:-1.5px;top:-1.5px;width:3px;height:3px;border-radius:50%;background:var(--hud)}
      #crosshair i{position:absolute;background:var(--hud);box-shadow:0 0 3px rgba(0,0,0,.7)}
      #crosshair i:nth-child(1),#crosshair i:nth-child(2){width:2px;height:6px;left:-1px}
      #crosshair i:nth-child(3),#crosshair i:nth-child(4){height:2px;width:6px;top:-1px}
      #crosshair i:nth-child(1){bottom:calc(var(--gap) + 5px)}
      #crosshair i:nth-child(2){top:calc(var(--gap) + 5px)}
      #crosshair i:nth-child(3){right:calc(var(--gap) + 5px)}
      #crosshair i:nth-child(4){left:calc(var(--gap) + 5px)}
      body.locked #crosshair{opacity:.95}
      body.dead #crosshair{opacity:0}
      #hitmarker{left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;opacity:0}
      #hitmarker::before,#hitmarker::after{content:"";position:absolute;left:10px;top:0;width:2px;height:22px;background:#fff;transform:rotate(45deg);box-shadow:0 0 4px #000}
      #hitmarker::after{transform:rotate(-45deg)}
      #hitmarker.show{opacity:1}
      #hitmarker.head::before,#hitmarker.head::after{background:#ffd34d}
      #hitmarker.kill::before,#hitmarker.kill::after{background:var(--warn)}
      #damage{inset:0;opacity:0;box-shadow:inset 0 0 160px rgba(255,50,30,.7);transition:opacity .2s}
      #damage.show{opacity:1;transition:none}
      #dead{inset:0;display:none;place-items:center;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:#ffd0c8;background:rgba(30,6,4,.35)}
      #dead.show{display:grid}
      #prompt{inset:auto 0 32px 0;text-align:center;font-size:14px}
      #prompt span{background:var(--panel);border:1px solid var(--hud-dim);padding:8px 16px}
      body.locked #prompt{display:none}
      #loading{inset:0;display:none;place-items:center;font-size:14px;letter-spacing:.24em;text-transform:uppercase;background:linear-gradient(#5d82b8,#b3c7da)}
      body.loading #loading{display:grid}
      body.loading #prompt{display:none}
      #error{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:24px;color:#0d1520}
      @media (max-width:640px){#tracker{width:110px;height:110px}#killfeed{bottom:136px}#weapon-ammo{font-size:24px}#weapon-rounds,#arsenal .bar{width:130px}#vitals{top:56px}}
      @media (prefers-reduced-motion: reduce){#crosshair,#damage{transition:none}}
    </style>
    <script type="module" crossorigin src="/modules/chunks/arena-BZovy6a-.js"></script>
    <link rel="modulepreload" crossorigin href="/modules/chunks/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="/modules/chunks/vendor-playcanvas-D9Qh8QTW.js">
    <link rel="modulepreload" crossorigin href="/modules/chunks/animation.pure-DbkTU1Mt.js">
    <link rel="modulepreload" crossorigin href="/modules/chunks/constants-Enqu4uL2.js">
    <link rel="modulepreload" crossorigin href="/modules/chunks/instancedMesh--R_H0qFp.js">
    <link rel="modulepreload" crossorigin href="/modules/chunks/spotLight.pure-B_Qh_45-.js">
    <link rel="modulepreload" crossorigin href="/modules/chunks/KHR_materials_emissive_strength-Dz8CsfST.js">
    <link rel="modulepreload" crossorigin href="/modules/chunks/cubeTexture.pure-CsarPoU1.js">
    <link rel="modulepreload" crossorigin href="/modules/chunks/meshopt_decoder-D6ReAWPT.js">
  </head>
  <body class="loading">
    <div id="stage">
      <div id="hud" class="hud"><h1>Vector Arena</h1><p>WASD move · Mouse look · Space jump · Shift sprint</p><p>Click fire · 1 / 2, Q or wheel switch · R reload</p></div>
      <div id="vitals" class="hud"><div class="label"><span>Health</span><span id="health-text">100</span></div><div class="bar"><div id="health-fill"></div></div></div>
      <div id="arsenal" class="hud"><div id="weapon-name">Assault Rifle</div><div id="weapon-ammo">32</div><div id="weapon-rounds" aria-hidden="true"></div><div class="bar"><div id="weapon-reload"></div></div><small>1 Assault Rifle · 2 Battle Rifle</small></div>
      <canvas id="tracker" class="hud" aria-label="Motion tracker" role="img"></canvas>
      <div id="killfeed" class="hud" aria-live="polite"></div>
      <div id="status" class="hud" aria-live="polite"></div>
      <div id="crosshair" class="hud" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div id="hitmarker" class="hud" aria-hidden="true"></div>
      <div id="damage" class="hud" aria-hidden="true"></div>
      <div id="dead" class="hud" role="status"></div>
      <div id="prompt" class="hud"><span>Click the arena to look around · Esc releases the mouse</span></div>
      <div id="loading" class="hud" role="status">Loading the arena…</div>
      <div id="error" role="alert"></div>
    </div>
  </body>
</html>
