<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Vector Arena · the library</title>
    <style>
      html,body{margin:0;height:100%;background:#05070f;color:#e9effc;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
      #stage{position:relative;width:100%;height:100%}
      #stage canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
      #hud{position:absolute;left:16px;top:14px;pointer-events:none;text-shadow:0 1px 3px #000}
      #hud h1{margin:0;font-size:18px;letter-spacing:.12em;text-transform:uppercase;color:#7ff0ff}
      #hud p{margin:4px 0 0;font-size:13px;opacity:.85}
      #status{position:absolute;right:16px;top:14px;font-size:12px;opacity:.8;pointer-events:none}
      #crosshair{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;pointer-events:none;opacity:0;transition:opacity .2s}
      #crosshair::before,#crosshair::after{content:"";position:absolute;background:#7ff0ff;box-shadow:0 0 6px #38e1ff}
      #crosshair::before{left:6px;top:0;width:2px;height:14px}
      #crosshair::after{top:6px;left:0;height:2px;width:14px}
      body.locked #crosshair{opacity:.9}
      #prompt{position:absolute;inset:auto 0 28px 0;text-align:center;font-size:14px;pointer-events:none}
      #prompt span{background:rgba(5,10,24,.72);border:1px solid rgba(127,240,255,.35);padding:8px 14px;border-radius:8px}
      body.locked #prompt{display:none}
      #error{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:24px}
      @media (prefers-reduced-motion: reduce){#crosshair{transition:none}}
    </style>
    <script type="module" crossorigin src="/modules/chunks/arena-ClaK1jao.js"></script>
    <link rel="modulepreload" crossorigin href="/modules/chunks/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="/modules/chunks/vendor-playcanvas-D9Qh8QTW.js">
    <link rel="modulepreload" crossorigin href="/modules/chunks/cameraInputsManager-CWa5GkkY.js">
    <link rel="modulepreload" crossorigin href="/modules/chunks/glowLayer.pure-BpWwWQu0.js">
    <link rel="modulepreload" crossorigin href="/modules/chunks/universalCamera-DJvD-NbP.js">
    <link rel="modulepreload" crossorigin href="/modules/chunks/cubeTexture.pure-CNu8RAPI.js">
  </head>
  <body>
    <div id="stage">
      <div id="hud"><h1>Vector Arena</h1><p>WASD move · Mouse look · Space jump · Shift sprint</p></div>
      <div id="status" aria-live="polite"></div>
      <div id="crosshair" aria-hidden="true"></div>
      <div id="prompt"><span>Click the arena to look around · Esc releases the mouse</span></div>
      <div id="error" role="alert"></div>
    </div>
  </body>
</html>
