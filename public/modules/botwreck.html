<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BotWreck 3D</title>
<style>
  :root { --bg: #07090f; --panel: rgba(12, 16, 28, 0.88); --line: rgba(120, 200, 255, 0.22); --accent: #39d0ff; --hot: #ff5a36; --text: #e8f1ff; --muted: #8ea3c0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: "Rajdhani", "Segoe UI", system-ui, sans-serif; }
  canvas { display: block; }
  .hidden { display: none !important; }
  #build { position: absolute; top: 0; left: 0; bottom: 0; width: 340px; padding: 22px 20px; background: var(--panel); border-right: 1px solid var(--line); backdrop-filter: blur(8px); overflow-y: auto; z-index: 5; }
  #build h1 { margin: 0; font-size: 34px; letter-spacing: 2px; font-weight: 800; }
  #build h1 span { color: var(--hot); }
  #build p.sub { margin: 4px 0 18px; color: var(--muted); font-size: 14px; letter-spacing: 1px; text-transform: uppercase; }
  .cfg { width: 100%; text-align: left; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.03); color: inherit; border-radius: 12px; padding: 14px; margin-bottom: 12px; cursor: pointer; font: inherit; transition: border-color .15s, background .15s, transform .15s; }
  .cfg:hover { border-color: var(--accent); transform: translateX(3px); }
  .cfg[aria-pressed="true"] { border-color: var(--accent); background: rgba(57, 208, 255, 0.1); box-shadow: 0 0 0 1px var(--accent) inset; }
  .cfg h2 { margin: 0 0 2px; font-size: 21px; letter-spacing: 1px; }
  .cfg small { color: var(--muted); font-size: 13px; }
  .bars { margin-top: 10px; display: grid; grid-template-columns: 62px 1fr; gap: 4px 10px; font-size: 12px; color: var(--muted); align-items: center; }
  .bar { height: 6px; background: rgba(255, 255, 255, 0.08); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #b388ff); }
  .paint { display: flex; gap: 8px; margin: 6px 0 18px; flex-wrap: wrap; }
  .paint button { width: 30px; height: 30px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; }
  .paint button[aria-pressed="true"] { border-color: #fff; }
  .label { font-size: 12px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-top: 6px; }
  #spawn { width: 100%; padding: 14px; font: inherit; font-size: 22px; font-weight: 800; letter-spacing: 3px; color: #fff; border: 0; border-radius: 12px; cursor: pointer; background: linear-gradient(135deg, #ff5a36, #ff2d6f); box-shadow: 0 8px 30px rgba(255, 70, 70, 0.35); }
  #spawn:hover { filter: brightness(1.1); }
  .keys { margin-top: 18px; font-size: 13px; color: var(--muted); line-height: 1.8; }
  kbd { display: inline-block; min-width: 22px; padding: 0 6px; border: 1px solid var(--line); border-radius: 5px; text-align: center; color: var(--text); background: rgba(255, 255, 255, 0.05); font-family: inherit; }
  #hud { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
  #speed { position: absolute; right: 26px; bottom: 22px; text-align: right; }
  #speed b { display: block; font-size: 64px; line-height: 1; font-weight: 800; }
  #speed span { color: var(--muted); letter-spacing: 3px; font-size: 13px; }
  .meter { position: absolute; left: 24px; bottom: 26px; width: 280px; }
  .meter div { margin-bottom: 10px; }
  .meter label { font-size: 12px; letter-spacing: 3px; color: var(--muted); display: flex; justify-content: space-between; }
  .meter .bar { height: 10px; border-radius: 5px; margin-top: 4px; }
  #integrity i { background: linear-gradient(90deg, #ff3b3b, #ffd23b 50%, #3bff8c); background-size: 280px 100%; }
  #boost i { background: linear-gradient(90deg, #ff9a3b, #ff3bd0); }
  #score { position: absolute; top: 18px; right: 24px; text-align: right; font-size: 14px; letter-spacing: 2px; color: var(--muted); }
  #score b { display: block; font-size: 30px; color: var(--text); }
  #toast { position: absolute; top: 18%; left: 50%; transform: translateX(-50%); font-size: 44px; font-weight: 800; letter-spacing: 4px; color: #fff; text-shadow: 0 0 24px rgba(255, 90, 54, 0.9); opacity: 0; transition: opacity .25s; white-space: nowrap; }
  #topbar { position: absolute; top: 16px; left: 20px; display: flex; gap: 10px; pointer-events: auto; }
  #topbar button { font: inherit; font-size: 15px; font-weight: 700; letter-spacing: 2px; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; cursor: pointer; }
  #topbar button:hover { border-color: var(--accent); }
  #help { position: absolute; bottom: 118px; left: 24px; font-size: 13px; color: var(--muted); letter-spacing: 1px; }
  #touch { position: absolute; left: 0; right: 0; bottom: 90px; display: flex; justify-content: space-between; padding: 0 16px; pointer-events: none; }
  #touch button { pointer-events: auto; width: 74px; height: 74px; border-radius: 50%; border: 1px solid var(--line); background: rgba(12,16,28,0.6); color: var(--text); font-size: 26px; touch-action: none; }
  #touch span { flex: 1; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 10; font-size: 22px; letter-spacing: 4px; }
  #loading.err { color: #ff8a8a; text-align: center; padding: 30px; font-size: 18px; letter-spacing: 1px; }
  @media (max-width: 760px) { #build { width: 100%; height: 56%; top: auto; border-right: 0; border-top: 1px solid var(--line); } .meter { width: 180px; } #speed b { font-size: 44px; } #help { display: none; } }
</style>
<script src="module-scores.js"></script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js" } }

<body>
<div id="loading">LOADING ARENA…</div>
<aside id="build" aria-label="Build mode">
  <h1>BOT<span>WRECK</span> 3D</h1>
  <p class="sub">Build mode · pick a frame</p>
  <div id="configs"></div>
  <div class="label">Paint</div>
  <div class="paint" id="paint"></div>
  <button id="spawn">SPAWN &amp; DRIVE</button>
  <div class="keys">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / arrows drive · <kbd>Space</kbd> handbrake<br>
    <kbd>Shift</kbd> rocket boost · <kbd>R</kbd> respawn · <kbd>F</kbd> flip upright<br>

</aside>
<div id="hud" class="hidden">
  <div id="topbar"><button id="toBuild">◀ BUILD</button><button id="respawn">RESPAWN</button></div>

  <div id="toast"></div>
  <div id="help">Hit the ramp, ram the wall, blast the red crates.</div>
  <div class="meter">
    <div><label>INTEGRITY <span id="intText">100%</span></label><div class="bar" id="integrity"><i style="width:100%"></i></div></div>
    <div id="boostWrap"><label>BOOST <span id="boostText">100%</span></label><div class="bar" id="boost"><i style="width:100%"></i></div></div>
  </div>
  <div id="speed"><b id="speedVal">0</b><span>KM/H</span></div>
  <div id="touch" class="hidden"><button data-k="ArrowLeft" aria-label="Steer left">◀</button><button data-k="ArrowRight" aria-label="Steer right">▶</button><span></span><button data-k="ShiftLeft" aria-label="Boost">⚡</button><button data-k="ArrowDown" aria-label="Reverse">▼</button><button data-k="ArrowUp" aria-label="Accelerate">▲</button></div>
</div>
<script type="module">
/* =====================================================================
   BotWreck 3D — a destructible robot-vehicle crash sandbox.
   Rendering: Three.js. Physics: cannon-es (RaycastVehicle for driving,
   LockConstraints that break under force or impact for every bolt-on part).
   ===================================================================== */
let THREE, CANNON;
try {
  THREE = await import('three');
  CANNON = await import('cannon-es');
} catch (error) {
  const el = document.getElementById('loading');
  el.classList.add('err');
  el.textContent = 'The 3D engine could not load. Check your internet connection and refresh the page.';
  throw error;
}

/* ---------------- Vehicle configurations ---------------- */
const CONFIGS = {
  speedster: {
    name: 'Speedster', blurb: 'Featherweight racer. Thin armor, huge top speed.',
    stats: { Speed: 0.95, Armor: 0.3, Weight: 0.25, Boost: 0.3 },
    chassis: { size: [3.6, 0.45, 1.7], mass: 140 }, engine: 1100, steer: 0.5, wheelRadius: 0.42, wheelX: 1.25, wheelZ: 0.95, grip: 2.2,
    strength: 9, wheelStrength: 14, boost: 0, jointMul: 0.8,
    parts: [
      { kind: 'armor', size: [1.1, 0.25, 1.6], at: [-1.2, 0.35, 0], mass: 8, name: 'Hood' },
      { kind: 'armor', size: [0.9, 0.5, 1.2], at: [0.2, 0.47, 0], mass: 10, name: 'Cockpit', color: 0x1a2440 },
      { kind: 'armor', size: [0.25, 0.35, 1.9], at: [-1.95, 0.0, 0], mass: 6, name: 'Bumper', color: 0x222831 },
      { kind: 'wing', size: [0.5, 0.08, 1.9], at: [1.6, 0.85, 0], mass: 5, name: 'Spoiler', color: 0x222831 },
      { kind: 'armor', size: [0.12, 0.4, 0.6], at: [1.6, 0.48, 0.65], mass: 2, name: 'Wing strut L', color: 0x222831 },
      { kind: 'armor', size: [0.12, 0.4, 0.6], at: [1.6, 0.48, -0.65], mass: 2, name: 'Wing strut R', color: 0x222831 },
      { kind: 'armor', size: [2.2, 0.3, 0.12], at: [0, 0.2, 0.9], mass: 5, name: 'Side skirt L' },
      { kind: 'armor', size: [2.2, 0.3, 0.12], at: [0, 0.2, -0.9], mass: 5, name: 'Side skirt R' },
    ],
  },
  tank: {
    name: 'Tank', blurb: 'Brick-built bruiser. Slow, heavy, almost unbreakable.',
    stats: { Speed: 0.4, Armor: 1.0, Weight: 1.0, Boost: 0.2 },
    chassis: { size: [3.8, 0.8, 2.2], mass: 420 }, engine: 2600, steer: 0.42, wheelRadius: 0.6, wheelX: 1.3, wheelZ: 1.25, grip: 2.6,
    strength: 25, wheelStrength: 32, boost: 0, jointMul: 2.6,
    parts: [
      { kind: 'armor', size: [1.4, 0.6, 2.2], at: [-0.9, 0.7, 0], mass: 40, name: 'Front plate' },
      { kind: 'armor', size: [1.4, 0.6, 2.2], at: [0.7, 0.7, 0], mass: 40, name: 'Rear plate' },
      { kind: 'armor', size: [1.1, 0.6, 1.4], at: [-0.1, 1.3, 0], mass: 35, name: 'Turret', color: 0x2c3a2e },
      { kind: 'armor', size: [1.6, 0.18, 0.18], at: [-1.2, 1.35, 0], mass: 8, name: 'Barrel', color: 0x1d241e },
      { kind: 'armor', size: [0.45, 0.7, 2.6], at: [-2.1, 0.1, 0], mass: 45, name: 'Ram', color: 0x3a3f45 },
      { kind: 'armor', size: [3.2, 0.5, 0.25], at: [0, 0.35, 1.25], mass: 30, name: 'Side armor L' },
      { kind: 'armor', size: [3.2, 0.5, 0.25], at: [0, 0.35, -1.25], mass: 30, name: 'Side armor R' },
      { kind: 'armor', size: [0.4, 0.5, 2.0], at: [2.05, 0.3, 0], mass: 25, name: 'Tailgate' },
    ],
  },
  rocket: {
    name: 'Rocket Bot', blurb: 'Twin boosters strapped to a go-kart. What could go wrong?',
    stats: { Speed: 0.75, Armor: 0.55, Weight: 0.55, Boost: 1.0 },
    chassis: { size: [3.4, 0.55, 1.9], mass: 220 }, engine: 1500, steer: 0.48, wheelRadius: 0.5, wheelX: 1.2, wheelZ: 1.05, grip: 2.3,
    strength: 13, wheelStrength: 18, boost: 5200, jointMul: 1.1,
    parts: [
      { kind: 'nose', size: [0.9, 0.45, 1.3], at: [-1.95, 0.15, 0], mass: 10, name: 'Nose cone' },
      { kind: 'armor', size: [1.2, 0.5, 1.4], at: [-0.4, 0.5, 0], mass: 18, name: 'Cabin', color: 0x1a2440 },
      { kind: 'booster', size: [1.5, 0.5, 0.5], at: [1.35, 0.62, 0.55], mass: 14, name: 'Booster L' },
      { kind: 'booster', size: [1.5, 0.5, 0.5], at: [1.35, 0.62, -0.55], mass: 14, name: 'Booster R' },
      { kind: 'armor', size: [0.6, 0.12, 2.0], at: [1.0, 0.95, 0], mass: 5, name: 'Fin', color: 0x222831 },
      { kind: 'armor', size: [2.0, 0.3, 0.14], at: [-0.2, 0.3, 1.0], mass: 7, name: 'Side panel L' },
      { kind: 'armor', size: [2.0, 0.3, 0.14], at: [-0.2, 0.3, -1.0], mass: 7, name: 'Side panel R' },
    ],
  },
};
const PAINTS = [0xff5a36, 0x39d0ff, 0xffd23b, 0x3bff8c, 0xb388ff, 0xf2f4f8, 0x2b2f38];
let selected = 'rocket', paint = PAINTS[0];

/* ---------------- Renderer, scene, camera ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1220);
scene.fog = new THREE.Fog(0x0d1220, 90, 260);
const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 600);
camera.position.set(14, 8, 14);
scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x1a1410, 0.55));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(40, 70, 25); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 200 });
sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);
const rim = new THREE.DirectionalLight(0x39d0ff, 0.6); rim.position.set(-40, 20, -40); scene.add(rim);
window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

/* Sky dome with a gradient shader. */
{
  const geo = new THREE.SphereGeometry(400, 32, 16);
  const mat = new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false, uniforms: { top: { value: new THREE.Color(0x0a1a3a) }, mid: { value: new THREE.Color(0x3a4f7a) }, bot: { value: new THREE.Color(0xff8a5c) } },
    vertexShader: 'varying vec3 vP; void main(){ vP = (modelMatrix * vec4(position,1.0)).xyz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'uniform vec3 top; uniform vec3 mid; uniform vec3 bot; varying vec3 vP; void main(){ float h = normalize(vP).y; vec3 c = h > 0.08 ? mix(mid, top, smoothstep(0.08, 0.6, h)) : mix(bot, mid, smoothstep(-0.05, 0.08, h)); gl_FragColor = vec4(c, 1.0); }' });
  scene.add(new THREE.Mesh(geo, mat));
}

/* ---------------- Physics world ---------------- */
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
world.broadphase = new CANNON.SAPBroadphase(world);
world.allowSleep = true;
world.defaultContactMaterial.friction = 0.35;
world.defaultContactMaterial.restitution = 0.15;
world.solver.iterations = 14;
const G_WORLD = 1, G_CHASSIS = 2, G_PART = 4, G_DEBRIS = 8, G_CRATE = 16;
const ALL = G_WORLD | G_CHASSIS | G_PART | G_DEBRIS | G_CRATE;
const groundMat = new CANNON.Material('ground'), wheelMat = new CANNON.Material('wheel');
world.addContactMaterial(new CANNON.ContactMaterial(groundMat, wheelMat, { friction: 0.4, restitution: 0, contactEquationStiffness: 1000 }));

const synced = []; // { body, mesh }
function link(body, mesh) { const entry = { body, mesh }; synced.push(entry); return entry; }

/* ---------------- Procedural textures ---------------- */
function canvasTexture(w, h, draw, repeat = 1) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; }
const gridTex = canvasTexture(256, 256, (g, w, h) => { g.fillStyle = '#151b26'; g.fillRect(0, 0, w, h); g.strokeStyle = 'rgba(57,208,255,0.35)'; g.lineWidth = 3; g.strokeRect(0, 0, w, h); g.strokeStyle = 'rgba(57,208,255,0.12)'; g.lineWidth = 1; for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(i * w / 4, 0); g.lineTo(i * w / 4, h); g.moveTo(0, i * h / 4); g.lineTo(w, i * h / 4); g.stroke(); } }, 60);
const concreteTex = canvasTexture(256, 256, (g, w, h) => { g.fillStyle = '#8b8f96'; g.fillRect(0, 0, w, h); for (let i = 0; i < 2500; i++) { const v = 110 + Math.random() * 60; g.fillStyle = `rgba(${v},${v},${v + 4},0.35)`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); } g.strokeStyle = 'rgba(40,40,45,0.5)'; g.lineWidth = 2; g.strokeRect(0, 0, w, h); g.beginPath(); g.moveTo(0, h / 2); g.lineTo(w, h / 2); g.stroke(); });
const crateTex = canvasTexture(128, 128, (g, w, h) => { g.fillStyle = '#a8763e'; g.fillRect(0, 0, w, h); g.strokeStyle = '#6e4a22'; g.lineWidth = 10; g.strokeRect(5, 5, w - 10, h - 10); g.lineWidth = 8; g.beginPath(); g.moveTo(8, 8); g.lineTo(w - 8, h - 8); g.stroke(); for (let i = 0; i < 6; i++) { g.strokeStyle = 'rgba(80,50,20,0.3)'; g.lineWidth = 1; g.beginPath(); g.moveTo(0, i * 22 + 10); g.lineTo(w, i * 22 + 12); g.stroke(); } });
const tntTex = canvasTexture(128, 128, (g, w, h) => { g.fillStyle = '#c4231c'; g.fillRect(0, 0, w, h); g.fillStyle = '#ffd23b'; for (let i = -2; i < 6; i++) { g.save(); g.translate(i * 28, 0); g.transform(1, 0, -0.6, 1, 0, 0); g.fillRect(0, h - 26, 14, 26); g.fillRect(0, 0, 14, 22); g.restore(); } g.fillStyle = '#fff'; g.font = 'bold 30px sans-serif'; g.textAlign = 'center'; g.fillText('TNT', w / 2, h / 2 + 11); g.strokeStyle = '#5a0d0a'; g.lineWidth = 6; g.strokeRect(3, 3, w - 6, h - 6); });
const hazardTex = canvasTexture(256, 64, (g, w, h) => { g.fillStyle = '#16181d'; g.fillRect(0, 0, w, h); g.fillStyle = '#ffd23b'; for (let i = -2; i < 12; i++) { g.save(); g.translate(i * 32, 0); g.transform(1, 0, -1, 1, 0, 0); g.fillRect(0, 0, 16, h); g.restore(); } }, 1);

/* ---------------- Arena ---------------- */
const ARENA = 110;
function staticBox(size, pos, mat, rotX = 0, rotY = 0, castShadow = true) {
  const body = new CANNON.Body({ mass: 0, material: groundMat, collisionFilterGroup: G_WORLD, collisionFilterMask: ALL });
  body.addShape(new CANNON.Box(new CANNON.Vec3(size[0] / 2, size[1] / 2, size[2] / 2)));
  body.position.set(...pos); body.quaternion.setFromEuler(rotX, rotY, 0);
  world.addBody(body);
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(...size), mat);
  mesh.position.copy(body.position); mesh.quaternion.copy(body.quaternion); mesh.castShadow = castShadow; mesh.receiveShadow = true;
  scene.add(mesh);
  return { body, mesh };
}
{
  const ground = new CANNON.Body({ mass: 0, material: groundMat, collisionFilterGroup: G_WORLD, collisionFilterMask: ALL });
  ground.addShape(new CANNON.Plane()); ground.quaternion.setFromEuler(-Math.PI / 2, 0, 0); world.addBody(ground);
  const gmesh = new THREE.Mesh(new THREE.PlaneGeometry(ARENA * 4, ARENA * 4), new THREE.MeshStandardMaterial({ map: gridTex, roughness: 0.85, metalness: 0.1 }));
  gmesh.rotation.x = -Math.PI / 2; gmesh.receiveShadow = true; scene.add(gmesh);
  const wallMat = new THREE.MeshStandardMaterial({ map: hazardTex, roughness: 0.6 });
  for (const [x, z, w, d] of [[0, ARENA, ARENA * 2 + 4, 2], [0, -ARENA, ARENA * 2 + 4, 2], [ARENA, 0, 2, ARENA * 2], [-ARENA, 0, 2, ARENA * 2]]) staticBox([w, 3, d], [x, 1.5, z], wallMat);
}
// The massive jump ramp
const rampMat = new THREE.MeshStandardMaterial({ color: 0x39434f, roughness: 0.5, metalness: 0.4 });
const rampLen = 30, rampAngle = 0.32;
staticBox([12, 1, rampLen], [0, Math.sin(rampAngle) * rampLen / 2 - 0.2, -30], rampMat, rampAngle, 0);
{ const stripe = new THREE.Mesh(new THREE.PlaneGeometry(11.6, rampLen - 0.5), new THREE.MeshBasicMaterial({ map: canvasTexture(64, 256, (g, w, h) => { g.fillStyle = '#0000'; g.clearRect(0, 0, w, h); g.fillStyle = '#ffd23b'; for (let y = 0; y < h; y += 32) g.fillRect(w / 2 - 3, y, 6, 18); g.fillStyle = '#39d0ff'; g.fillRect(0, 0, 4, h); g.fillRect(w - 4, 0, 4, h); }), transparent: true }));
  stripe.position.set(0, Math.sin(rampAngle) * rampLen / 2 - 0.2 + 0.51 * Math.cos(rampAngle), -30 + 0.51 * Math.sin(rampAngle)); stripe.rotation.set(-Math.PI / 2 + rampAngle, 0, 0); scene.add(stripe); }
// support struts under the ramp lip
for (const x of [-5, 5]) staticBox([0.6, 9.4, 0.6], [x, 4.7, -44.5], new THREE.MeshStandardMaterial({ color: 0x222831, metalness: 0.6, roughness: 0.4 }));
// Solid concrete wall
const concreteMat = new THREE.MeshStandardMaterial({ map: concreteTex, roughness: 0.95 });
staticBox([34, 6, 2.4], [-40, 3, 26], concreteMat, 0, 0.35);
staticBox([2.4, 4, 16], [44, 2, 30], concreteMat);

function boostersLeft() { return car ? car.parts.filter(p => p.def.kind === 'booster' && !p.detached) : []; }

/* ---------------- Main loop ---------------- */
let clock = 0, last = performance.now(), hudTick = 0;

  if (!grounded) car.airTime += dt; else { if (car.airTime > 1.0) { const pts = Math.round(car.airTime * 300); car.score += pts; toast(`BIG AIR! +${pts}`); } car.airTime = 0; }

}
function breakOverloadedJoints() {
