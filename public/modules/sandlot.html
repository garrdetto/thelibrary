const W = 960, H = 600;
const now = () => performance.now();
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist2 = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const DEG = Math.PI / 180;
function mulberry32(a) {
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
class RNG {
  constructor(seed) { this.reseed(seed); }
  reseed(seed) { this.seed = (seed >>> 0) || 1; this.f = mulberry32(this.seed); }
  next() { return this.f(); }
  range(a, b) { return a + (b - a) * this.f(); }
  int(a, b) { return Math.floor(this.range(a, b + 1)); }
  pick(arr) { return arr[Math.floor(this.f() * arr.length)]; }
  chance(p) { return this.f() < p; }
  gauss() { let u = 0, v = 0; while (u === 0) u = this.f(); while (v === 0) v = this.f(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
}
const rng = new RNG(Date.now());      // gameplay randomness (seeded per game, shared online)
const fx = new RNG(Date.now() ^ 0x5eed); // cosmetic-only randomness
function fillTemplate(text, ctx) { return text.replace(/\{(\w+)\}/g, (m, k) => ctx[k] != null ? ctx[k] : m); }
function shuffle(arr, r = rng) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r.next() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function overall(k) { const s = k.stats; return Math.round((s.con * 1.1 + s.pow + s.spd * 0.8 + s.pit * 0.9 + s.fld + s.arm * 0.7) / 5.5 * 10) / 10; }
function storageGet(key) { try { const v = window.localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function storageSet(key, value) { try { window.localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; } }
function storageDel(key) { try { window.localStorage.removeItem(key); } catch (e) { /* storage unavailable */ } }

function seasonRecordGame(g) {

/* the library bridge: the site chat can ask this module to open an online room and invite people */
function tlPostRoom(code) { try { if (window.parent !== window) window.parent.postMessage({ type: 'tl-room', code }, location.origin); } catch (e) { /* standalone */ } }
window.addEventListener('message', e => { if (e.origin !== location.origin || !e.data || e.data.type !== 'tl-host') return; if (NET.role === 'host' && NET.code && NET.peer && NET.peer.open) { tlPostRoom(NET.code); return; } screen = 'online'; netHost(); });
/* =====================================================================
   BOOT
   ===================================================================== */
(function boot() {
  const params = new URLSearchParams(location.search);
  if (params.get('room')) { ui.joinCode = params.get('room').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6); screen = 'online'; if (ui.joinCode.length === 6) setTimeout(() => netJoin(ui.joinCode), 300); }
  if (params.get('autoplay')) {
    const ids = shuffle(ROSTER.map(k => k.id));
    SETUP.field = (+params.get('field') || 0) % FIELDS.length;
    const teams = [makeTeam('Elm Ave. Eagles', TEAM_COLORS[1], ids.slice(0, 9), 'cpu'), makeTeam('Maple St. Mudcats', TEAM_COLORS[0], ids.slice(9, 18), 'cpu')];
    startGame(newGame({ mode: 'watch', field: SETUP.field, innings: +params.get('innings') || 3, diff: 'pro', seed: +params.get('seed') || 7, teams }));
  }
  requestAnimationFrame(frame);
})();
