<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chess</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
<style>
  :root { --bg: #0b0f19; --panel: #131a2a; --panel2: #182136; --line: #26324c; --text: #e8eefc; --muted: #8796b5; --accent: #39d0ff; --accent2: #7c5cff; --light: #c9d3e6; --dark: #5a6c92; --hl: rgba(57, 208, 255, 0.45); --last: rgba(255, 210, 60, 0.38); --danger: #ff5a6a; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #eef2f8; --panel: #ffffff; --panel2: #f4f6fb; --line: #d3dae8; --text: #121826; --muted: #5d6b86; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; }
  .app { display: grid; grid-template-columns: minmax(0, auto) 330px; gap: 20px; padding: 18px; justify-content: center; align-items: start; }
  .boardwrap { --size: min(calc(100vh - 140px), calc(100vw - 390px), 640px); width: var(--size); }
  .player { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 4px; }
  .player .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); }
  .player .name { font-weight: 600; }
  .player .caps { margin-left: auto; font-size: 18px; letter-spacing: -2px; color: var(--muted); font-family: "DejaVu Sans", "Segoe UI Symbol", "Noto Sans Symbols 2", sans-serif; }
  .player .adv { font-size: 12px; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
  .player.turn .name::after { content: "  ● to move"; color: var(--accent); font-size: 12px; font-weight: 500; }
  .board { position: relative; width: var(--size); height: var(--size); display: grid; grid-template-columns: repeat(8, 1fr); border-radius: 10px; overflow: hidden; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45), 0 0 0 1px var(--line); touch-action: none; user-select: none; }
  .sq { position: relative; display: grid; place-items: center; }
  .sq.l { background: var(--light); } .sq.d { background: var(--dark); }
  .sq.last::before { content: ""; position: absolute; inset: 0; background: var(--last); }
  .sq.sel::before { content: ""; position: absolute; inset: 0; background: var(--hl); }
  .sq.check::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, rgba(255, 60, 80, 0.9) 0%, rgba(255, 60, 80, 0.35) 45%, transparent 70%); }
  .sq.move::after { content: ""; position: absolute; width: 28%; height: 28%; border-radius: 50%; background: rgba(15, 25, 45, 0.35); }
  .sq.cap::after { content: ""; position: absolute; inset: 4%; border-radius: 50%; border: 5px solid rgba(15, 25, 45, 0.35); }
  .sq .co { position: absolute; font-size: 10px; font-weight: 700; opacity: 0.7; pointer-events: none; }
  .sq .co.r { top: 3px; left: 4px; } .sq .co.f { bottom: 2px; right: 4px; }
  .sq.l .co { color: var(--dark); } .sq.d .co { color: var(--light); }
  .pc { position: relative; z-index: 2; font-size: calc(var(--size) / 8 * 0.78); line-height: 1; cursor: grab; font-family: "DejaVu Sans", "Segoe UI Symbol", "Noto Sans Symbols 2", "Apple Symbols", sans-serif; transition: transform .12s; }
  .pc.w { color: #fbfbf7; text-shadow: 0 0 2px #111, 0 0 2px #111, 0 2px 3px rgba(0, 0, 0, 0.5); }
  .pc.b { color: #1a1d24; text-shadow: 0 0 2px #e8e8e8, 0 0 1px #e8e8e8, 0 2px 3px rgba(0, 0, 0, 0.4); }
  .pc.drag { position: fixed; z-index: 50; pointer-events: none; transform: translate(-50%, -55%) scale(1.15); }
  .pc.ghost { opacity: 0.3; }
  .side { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 36px); }
  h1 { margin: 0; font: 700 32px Rajdhani, sans-serif; letter-spacing: 1px; }
  h1 span { color: var(--accent); }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  button, select, input { font: 600 13px Inter, sans-serif; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; }
  button { cursor: pointer; } button:hover:not(:disabled) { border-color: var(--accent); } button:disabled { opacity: 0.45; cursor: not-allowed; }
  button[aria-pressed="true"] { border-color: var(--accent); background: rgba(57, 208, 255, 0.12); }
  button.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #06101f; border: 0; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row > * { flex: 1; }
  .status { padding: 10px 12px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); font-weight: 600; min-height: 42px; }
  .status.alert { border-color: var(--danger); color: var(--danger); }
  .moves { flex: 1; min-height: 120px; overflow-y: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; display: grid; grid-template-columns: 34px 1fr 1fr; gap: 2px 6px; align-content: start; }
  .moves span { padding: 2px 4px; border-radius: 4px; } .moves .n { color: var(--muted); } .moves .cur { background: rgba(57, 208, 255, 0.18); }
  .online { display: grid; gap: 8px; }
  .code { font: 700 30px Rajdhani, sans-serif; letter-spacing: 8px; text-align: center; padding: 6px; border: 1px dashed var(--accent); border-radius: 10px; }
  .muted { color: var(--muted); font-size: 12px; line-height: 1.5; }
  .netdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); margin-right: 6px; } .netdot.on { background: #3bff8c; }
  .modal { position: absolute; inset: 0; display: none; place-items: center; background: rgba(5, 8, 15, 0.6); z-index: 60; backdrop-filter: blur(2px); }
  .modal.show { display: grid; }
  .modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; text-align: center; display: grid; gap: 12px; min-width: 240px; }
  .promo { display: flex; gap: 8px; } .promo button { font-size: 40px; padding: 4px 10px; font-family: "DejaVu Sans", "Segoe UI Symbol", sans-serif; }
  .emotes { display: flex; gap: 6px; } .emotes button { flex: 1; font-size: 12px; }
  .bubble { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); background: var(--panel); border: 1px solid var(--accent); padding: 10px 16px; border-radius: 12px; font-weight: 700; z-index: 70; animation: fade 2.2s forwards; pointer-events: none; }
  @keyframes fade { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; } .boardwrap { --size: min(calc(100vw - 36px), 640px); margin: 0 auto; } .side { max-height: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="boardwrap">
    <div class="player" id="topPlayer"><span class="dot"></span><span class="name">Black</span><span class="caps"></span></div>
    <div class="board" id="board" role="grid" aria-label="Chess board"></div>
    <div class="player" id="botPlayer"><span class="dot"></span><span class="name">White</span><span class="caps"></span></div>
  </div>
  <aside class="side">
    <h1>CHESS<span>.</span></h1>
    <div class="tabs" role="tablist">
      <button data-mode="cpu" aria-pressed="true">vs CPU</button>
      <button data-mode="local" aria-pressed="false">2 Players</button>
      <button data-mode="online" aria-pressed="false">Online</button>
    </div>
    <div id="cpuOpts" class="row"><select id="level" aria-label="CPU level"><option value="1">Easy</option><option value="2" selected>Medium</option><option value="3">Hard</option></select><select id="color" aria-label="Your color"><option value="w">Play White</option><option value="b">Play Black</option><option value="r">Random</option></select></div>
    <div id="onlineOpts" class="online" hidden>
      <div class="row"><button id="hostBtn">Host match</button><input id="joinCode" maxlength="6" placeholder="CODE" aria-label="Room code" style="text-transform:uppercase;letter-spacing:3px;text-align:center"><button id="joinBtn">Join</button></div>
      <div id="codeBox" class="code" hidden></div>
      <div class="muted" id="netStatus"><span class="netdot"></span>Not connected. Host to get a code, or enter a friend's code.</div>
      <div class="emotes"><button data-emote="gg">GG</button><button data-emote="nice">Nice move!</button><button data-emote="hmm">Hmm…</button><button data-emote="oops">Oops</button></div>
    </div>
    <div class="status" id="status">White to move</div>
    <div class="row"><button id="newBtn" class="primary">New match</button><button id="undoBtn">Undo</button><button id="flipBtn">Flip</button></div>
    <div class="row"><button id="resignBtn">Resign</button><button id="drawBtn">Offer draw</button></div>
    <div class="moves" id="moves" aria-label="Move list"></div>
  </aside>
</div>
<div class="modal" id="promoModal"><div class="box"><b>Promote to</b><div class="promo" id="promoChoices"></div></div></div>
<div class="modal" id="drawModal"><div class="box"><b>Your opponent offers a draw</b><div class="row"><button id="drawYes">Accept</button><button id="drawNo">Decline</button></div></div></div>

<script id="engine">
/* ===================== CHESS ENGINE (no DOM; shared with the AI worker) ===================== */
var Chess = (function () {
  const FILES = 'abcdefgh';
  const N = -8, S = 8, E = 1, Wd = -1;
  const KNIGHT = [-17, -15, -10, -6, 6, 10, 15, 17], KING = [-9, -8, -7, -1, 1, 7, 8, 9];
  const BISHOP = [-9, -7, 7, 9], ROOK = [-8, -1, 1, 8];
  const sqName = i => FILES[i & 7] + (8 - (i >> 3));
  const sqIdx = s => (8 - +s[1]) * 8 + FILES.indexOf(s[0]);
  const colorOf = p => p ? (p === p.toUpperCase() ? 'w' : 'b') : null;
  const fileOf = i => i & 7, rankOf = i => i >> 3;
  function fromFEN(fen) {
    const [pos, turn, cast, ep, half, full] = fen.trim().split(/\s+/);
    const board = []; for (const ch of pos.replace(/\//g, '')) { if (/\d/.test(ch)) for (let k = 0; k < +ch; k++) board.push(''); else board.push(ch); }
    return { board, turn: turn || 'w', castling: cast && cast !== '-' ? cast : '', ep: ep && ep !== '-' ? sqIdx(ep) : -1, half: +half || 0, full: +full || 1, stack: [], keys: [] };
  }
  function toFEN(st, short) {
    let s = ''; for (let r = 0; r < 8; r++) { let e = 0; for (let f = 0; f < 8; f++) { const p = st.board[r * 8 + f]; if (!p) e++; else { if (e) { s += e; e = 0; } s += p; } } if (e) s += e; if (r < 7) s += '/'; }
    const base = `${s} ${st.turn} ${st.castling || '-'} ${st.ep >= 0 ? sqName(st.ep) : '-'}`;
    return short ? base : `${base} ${st.half} ${st.full}`;
  }
  function attacked(st, sq, by) {
    const b = st.board, f = fileOf(sq);
    const pawn = by === 'w' ? 'P' : 'p', dir = by === 'w' ? 8 : -8;
    for (const df of [-1, 1]) { const s = sq + dir + df; if (fileOf(sq) + df >= 0 && fileOf(sq) + df < 8 && s >= 0 && s < 64 && b[s] === pawn) return true; }
    const kn = by === 'w' ? 'N' : 'n'; for (const d of KNIGHT) { const s = sq + d; if (s < 0 || s > 63 || Math.abs(fileOf(s) - f) > 2) continue; if (b[s] === kn) return true; }
    const kg = by === 'w' ? 'K' : 'k'; for (const d of KING) { const s = sq + d; if (s < 0 || s > 63 || Math.abs(fileOf(s) - f) > 1) continue; if (b[s] === kg) return true; }
    const bq = by === 'w' ? ['B', 'Q'] : ['b', 'q'], rq = by === 'w' ? ['R', 'Q'] : ['r', 'q'];
    for (const d of BISHOP) { let s = sq, pf = f; while (true) { s += d; if (s < 0 || s > 63 || Math.abs(fileOf(s) - pf) !== 1) break; pf = fileOf(s); if (b[s]) { if (bq.includes(b[s])) return true; break; } } }
    for (const d of ROOK) { let s = sq, pf = f; while (true) { s += d; if (s < 0 || s > 63) break; if ((d === 1 || d === -1) && Math.abs(fileOf(s) - pf) !== 1) break; pf = fileOf(s); if (b[s]) { if (rq.includes(b[s])) return true; break; } } }
    return false;
  }
  const kingSq = (st, c) => st.board.indexOf(c === 'w' ? 'K' : 'k');
  const inCheck = (st, c = st.turn) => attacked(st, kingSq(st, c), c === 'w' ? 'b' : 'w');
  function pseudo(st, capturesOnly) {
    const b = st.board, us = st.turn, them = us === 'w' ? 'b' : 'w', out = [];
    const add = (from, to, flags, promo) => { const cap = flags === 'e' ? (us === 'w' ? 'p' : 'P') : b[to]; if (capturesOnly && !cap && !promo) return; out.push({ from, to, piece: b[from], captured: cap || '', promo: promo || '', flags }); };
    for (let i = 0; i < 64; i++) {
      const p = b[i]; if (!p || colorOf(p) !== us) continue;
      const t = p.toLowerCase(), f = fileOf(i);
      if (t === 'p') {
        const dir = us === 'w' ? -8 : 8, start = us === 'w' ? 6 : 1, last = us === 'w' ? 0 : 7, one = i + dir;
        const promos = us === 'w' ? ['Q', 'R', 'B', 'N'] : ['q', 'r', 'b', 'n'];
        if (one >= 0 && one < 64 && !b[one]) {
          if (rankOf(one) === last) promos.forEach(pr => add(i, one, 'p', pr)); else if (!capturesOnly) { add(i, one, 'n'); const two = i + dir * 2; if (rankOf(i) === start && !b[two]) add(i, two, 'd'); }
        }
        for (const df of [-1, 1]) { if (f + df < 0 || f + df > 7) continue; const s = one + df; if (s < 0 || s > 63) continue; if (b[s] && colorOf(b[s]) === them) { if (rankOf(s) === last) promos.forEach(pr => add(i, s, 'pc', pr)); else add(i, s, 'c'); } else if (s === st.ep) add(i, s, 'e'); }
      } else if (t === 'n' || t === 'k') {
        for (const d of t === 'n' ? KNIGHT : KING) { const s = i + d; if (s < 0 || s > 63 || Math.abs(fileOf(s) - f) > (t === 'n' ? 2 : 1)) continue; if (!b[s]) { if (!capturesOnly) add(i, s, 'n'); } else if (colorOf(b[s]) === them) add(i, s, 'c'); }
        if (t === 'k' && !capturesOnly) {
          const home = us === 'w' ? 60 : 4, K = us === 'w' ? 'K' : 'k', Q = us === 'w' ? 'Q' : 'q';
          if (i === home && !attacked(st, home, them)) {
            if (st.castling.includes(K) && !b[home + 1] && !b[home + 2] && b[home + 3] === (us === 'w' ? 'R' : 'r') && !attacked(st, home + 1, them) && !attacked(st, home + 2, them)) add(i, home + 2, 'k');
            if (st.castling.includes(Q) && !b[home - 1] && !b[home - 2] && !b[home - 3] && b[home - 4] === (us === 'w' ? 'R' : 'r') && !attacked(st, home - 1, them) && !attacked(st, home - 2, them)) add(i, home - 2, 'q');
          }
        }
      } else {
        const dirs = t === 'b' ? BISHOP : t === 'r' ? ROOK : BISHOP.concat(ROOK);
        for (const d of dirs) { let s = i, pf = f; while (true) { s += d; if (s < 0 || s > 63) break; const nf = fileOf(s); if ((d === 1 || d === -1 || d === 9 || d === -9 || d === 7 || d === -7) && Math.abs(nf - pf) !== 1) break; pf = nf; if (!b[s]) { if (!capturesOnly) add(i, s, 'n'); } else { if (colorOf(b[s]) === them) add(i, s, 'c'); break; } } }
      }
    }
    return out;
  }
  function make(st, m) {
    const b = st.board, us = st.turn;
    st.stack.push({ m, castling: st.castling, ep: st.ep, half: st.half });
    b[m.to] = m.promo || m.piece; b[m.from] = '';
    if (m.flags === 'e') b[m.to + (us === 'w' ? 8 : -8)] = '';
    if (m.flags === 'k') { b[m.to - 1] = b[m.to + 1]; b[m.to + 1] = ''; }
    if (m.flags === 'q') { b[m.to + 1] = b[m.to - 2]; b[m.to - 2] = ''; }
    let c = st.castling;
    if (m.piece === 'K') c = c.replace(/[KQ]/g, ''); if (m.piece === 'k') c = c.replace(/[kq]/g, '');
    for (const [sq, ch] of [[63, 'K'], [56, 'Q'], [7, 'k'], [0, 'q']]) if (m.from === sq || m.to === sq) c = c.replace(ch, '');
    st.castling = c;
    st.ep = m.flags === 'd' ? (m.from + m.to) / 2 : -1;
    st.half = (m.piece.toLowerCase() === 'p' || m.captured) ? 0 : st.half + 1;
    if (us === 'b') st.full++;
    st.turn = us === 'w' ? 'b' : 'w';
  }
  function unmake(st) {
    const u = st.stack.pop(), m = u.m, b = st.board; st.turn = st.turn === 'w' ? 'b' : 'w'; const us = st.turn;
    b[m.from] = m.piece; b[m.to] = m.flags === 'e' ? '' : m.captured;
    if (m.flags === 'e') b[m.to + (us === 'w' ? 8 : -8)] = m.captured;
    if (m.flags === 'k') { b[m.to + 1] = b[m.to - 1]; b[m.to - 1] = ''; }
    if (m.flags === 'q') { b[m.to - 2] = b[m.to + 1]; b[m.to + 1] = ''; }
    st.castling = u.castling; st.ep = u.ep; st.half = u.half; if (us === 'b') st.full--;
  }
  function legal(st, capturesOnly) { const us = st.turn, out = []; for (const m of pseudo(st, capturesOnly)) { make(st, m); if (!inCheck(st, us)) out.push(m); unmake(st); } return out; }
  function perft(st, d) { if (d === 0) return 1; let n = 0; for (const m of legal(st)) { make(st, m); n += perft(st, d - 1); unmake(st); } return n; }
  function insufficient(st) { const p = st.board.filter(x => x && x.toLowerCase() !== 'k'); if (!p.length) return true; if (p.length === 1 && 'bn'.includes(p[0].toLowerCase())) return true; if (p.every(x => x.toLowerCase() === 'b')) { const colors = new Set(); st.board.forEach((x, i) => { if (x && x.toLowerCase() === 'b') colors.add((fileOf(i) + rankOf(i)) % 2); }); return colors.size === 1; } return false; }
  function san(st, m, all) {
    let s;
    if (m.flags === 'k') s = 'O-O'; else if (m.flags === 'q') s = 'O-O-O';
    else {
      const t = m.piece.toUpperCase();
      if (t === 'P') s = (m.captured ? FILES[fileOf(m.from)] + 'x' : '') + sqName(m.to) + (m.promo ? '=' + m.promo.toUpperCase() : '');
      else {
        const amb = all.filter(o => o !== m && o.piece === m.piece && o.to === m.to);
        let dis = ''; if (amb.length) { const sameFile = amb.some(o => fileOf(o.from) === fileOf(m.from)), sameRank = amb.some(o => rankOf(o.from) === rankOf(m.from)); dis = !sameFile ? FILES[fileOf(m.from)] : !sameRank ? String(8 - rankOf(m.from)) : sqName(m.from); }
        s = t + dis + (m.captured ? 'x' : '') + sqName(m.to);
      }
    }
    make(st, m); const chk = inCheck(st), mate = chk && legal(st).length === 0; unmake(st);
    return s + (mate ? '#' : chk ? '+' : '');
  }
  /* ---------- evaluation & search ---------- */
  const VAL = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 0 };
  const PST = {
    p: [0, 0, 0, 0, 0, 0, 0, 0, 50, 50, 50, 50, 50, 50, 50, 50, 10, 10, 20, 30, 30, 20, 10, 10, 5, 5, 10, 25, 25, 10, 5, 5, 0, 0, 0, 20, 20, 0, 0, 0, 5, -5, -10, 0, 0, -10, -5, 5, 5, 10, 10, -20, -20, 10, 10, 5, 0, 0, 0, 0, 0, 0, 0, 0],
    n: [-50, -40, -30, -30, -30, -30, -40, -50, -40, -20, 0, 0, 0, 0, -20, -40, -30, 0, 10, 15, 15, 10, 0, -30, -30, 5, 15, 20, 20, 15, 5, -30, -30, 0, 15, 20, 20, 15, 0, -30, -30, 5, 10, 15, 15, 10, 5, -30, -40, -20, 0, 5, 5, 0, -20, -40, -50, -40, -30, -30, -30, -30, -40, -50],
    b: [-20, -10, -10, -10, -10, -10, -10, -20, -10, 0, 0, 0, 0, 0, 0, -10, -10, 0, 5, 10, 10, 5, 0, -10, -10, 5, 5, 10, 10, 5, 5, -10, -10, 0, 10, 10, 10, 10, 0, -10, -10, 10, 10, 10, 10, 10, 10, -10, -10, 5, 0, 0, 0, 0, 5, -10, -20, -10, -10, -10, -10, -10, -10, -20],

    if (m.t === 'emote') bubble('Opponent: ' + String(m.text || '').slice(0, 30));
  },
};
$('#hostBtn').onclick = () => net.hostGame();
$('#joinBtn').onclick = () => { const c = $('#joinCode').value.trim().toUpperCase(); if (c.length === 6) net.joinGame(c); else net.status('Codes are 6 characters.', false); };
$('#joinCode').addEventListener('keydown', e => { if (e.key === 'Enter') $('#joinBtn').click(); });
window.addEventListener('pagehide', () => net.close());
if (params.get('room')) { setMode('online'); $('#joinCode').value = params.get('room'); setTimeout(() => $('#joinBtn').click(), 600); } else newGame();
window.__chess = { get st() { return st; }, applyMove, get over() { return over; } };
</script>
</body>
