# The Codex: chain of command, budgets and the Seal list.
# Only the Sovereign edits this file. The Throne Engine loads it read-only and refuses to start if it fails validation.

sovereign:
  seal_secret_env: EMPIRE_SEAL_SECRET     # Seal approvals are signed with this secret
  notify: telegram                        # telegram | discord | email

kill_switch: false                        # true pauses every agent except the Treasury and the Inquisition

chain_of_command:
  king: farquad
  warlords:
    oracle: nyx
    warroom: vane
    forge: kade
    foundry: vex
    treasury: quill
    heralds: lyra
    inquisition: orrin
    archive: thessaly
  inquisition_reports_to: [farquad, sovereign]

rank_ceilings:                            # highest model and effort each rank may run
  initiate:       {model: claude-haiku-5-5}
  servant:        {model: claude-sonnet-5-5, effort: low}
  adept:          {model: claude-sonnet-5-5, effort: medium}
  knight-captain: {model: claude-sonnet-5-5, effort: medium}
  warlord:        {model: claude-opus-5-5, effort: medium}
  king:           {model: claude-opus-5-5, effort: high}

routing:
  formula: "S = C + N + 3K"
  tiers:
    - {max_s: 9,  model: claude-haiku-5-5}
    - {max_s: 13, model: claude-sonnet-5-5, effort: low}
    - {max_s: 17, model: claude-sonnet-5-5, effort: medium}
    - {max_s: 21, assign_to: warlord}
    - {max_s: 25, assign_to: king}
  stakes_5_goes_to: king
  escalate_after_failed_reviews: 2
  step_down_after_first_try_passes: 10
  step_down_trial_size: 3
  step_down_min_pass_rate: 0.9
  budget_brake_at: 0.8                    # share of daily budget; then cap new tasks at sonnet low unless K >= 4

budgets_usd_per_day:                      # model spend; start lean, raise after the Treasury has real data
  global_ceiling: 20
  throne: 5
  oracle: 3
  warroom: 3
  forge: 2
  foundry: 2
  treasury: 1
  heralds: 1
  inquisition: 2.5
  archive: 0.5
  trials_max_share: 0.10

review:
  random_audit_rate: 0.10
  new_promotion_audit_rate: 0.30
  different_model_when_stakes_at_least: 4
  max_reviews_between_same_pair_per_week: 2
  max_revision_loops: 3

seal_required:                            # actions that always wait for the Sovereign
  - spend_money
  - new_subscription
  - raise_budget
  - create_account
  - accept_terms
  - first_publish_on_channel
  - set_or_change_price
  - refund_over_usd: 25
  - email_non_customer
  - deploy_production
  - delete_data
  - change_chain_of_command
  - exceed_routing_ceiling

refusals:                                 # never allowed, Seal or not
  - fake_reviews_or_testimonials
  - bot_or_sockpuppet_accounts
  - undisclosed_affiliate_links
  - undisclosed_ai_content_where_platform_requires
  - scraping_against_site_terms
  - marketing_email_without_opt_in
  - impersonating_people_or_brands

ventures:
  max_live: 3
  first_phase_max_live: 1
  require_kill_criteria: true
