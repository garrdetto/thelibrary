    12. NETWORKING ...... PeerJS host/guest protocol
    13. SEASON .......... schedule, standings, leaders, playoffs
   ===================================================================== */

/* =====================================================================
   2. UTILITIES
   ===================================================================== */
const W = 960, H = 600;
const now = () => performance.now();
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist2 = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const DEG = Math.PI / 180;
function mulberry32(a) {
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
class RNG {
  constructor(seed) { this.reseed(seed); }
  reseed(seed) { this.seed = (seed >>> 0) || 1; this.f = mulberry32(this.seed); }
  next() { return this.f(); }
  range(a, b) { return a + (b - a) * this.f(); }
  int(a, b) { return Math.floor(this.range(a, b + 1)); }
  pick(arr) { return arr[Math.floor(this.f() * arr.length)]; }
  chance(p) { return this.f() < p; }
  gauss() { let u = 0, v = 0; while (u === 0) u = this.f(); while (v === 0) v = this.f(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
}
const rng = new RNG(Date.now());      // gameplay randomness (seeded per game, shared online)
const fx = new RNG(Date.now() ^ 0x5eed); // cosmetic-only randomness
function fillTemplate(text, ctx) { return text.replace(/\{(\w+)\}/g, (m, k) => ctx[k] != null ? ctx[k] : m); }
function shuffle(arr, r = rng) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r.next() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function overall(k) { const s = k.stats; return Math.round((s.con * 1.1 + s.pow + s.spd * 0.8 + s.pit * 0.9 + s.fld + s.arm * 0.7) / 5.5 * 10) / 10; }
function storageGet(key) { try { const v = window.localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch (e) { return null; } }

/* =====================================================================
   6. CONTACT RESOLUTION
   ===================================================================== */
const TIMING = { perfect: 40, good: 90, ok: 160 };

let DRAFT = null;

}

}

  else { DRAFT.turn = DRAFT.picks[1 - side].length < DRAFT.perTeam ? 1 - side : side; DRAFT.deadline = DRAFT.mode === 'online' ? clock() + 30000 : 0; DRAFT.nextCpu = clock() + 800; }
  if (NET.role === 'host') netSend({ t: 'draft', d: DRAFT });
}

  const stage = SEASON.phase === 'regular' ? `Game ${Math.min(SEASON.round + 1, 14)} of 14` : SEASON.phase === 'playoffs' ? (SEASON.playoff.stage === 'semis' ? 'Playoffs: Semifinals' : 'Playoffs: Championship') : 'Season complete';
  c.fillStyle = '#fff'; c.font = `bold 15px ${FONT}`; c.textAlign = 'left'; c.fillText(stage, 190, 40);
  ['standings', 'leaders', 'schedule'].forEach((tab, i) => button(420 + i * 130, 14, 120, 36, tab[0].toUpperCase() + tab.slice(1), () => { ui.tab = tab; }, { color: '#576574', selected: ui.tab === tab, size: 14, r: 8 }));
  panel(16, 62, 600, 470, 'rgba(10,30,24,0.75)');
  if (ui.tab === 'standings') {
    const st = seasonStanding(), lead = st[0];
    c.fillStyle = '#ffd32a'; c.font = `bold 12px ${FONT}`; ['TEAM', 'W', 'L', 'T', 'PCT', 'GB', 'RS', 'RA'].forEach((h2, i) => c.fillText(h2, i ? 300 + (i - 1) * 42 : 40, 90));
    st.forEach((s, r) => { const tm = SEASON.teams[s.i], y = 120 + r * 48; c.fillStyle = tm.user ? 'rgba(255,211,42,0.18)' : 'rgba(255,255,255,0.05)'; rrect(c, 28, y - 26, 576, 42, 8); c.fill(); c.fillStyle = tm.colors[0]; rrect(c, 36, y - 18, 16, 26, 4); c.fill(); c.fillStyle = '#fff'; c.font = `bold 14px ${FONT}`; c.textAlign = 'left'; c.fillText(`${r + 1}. ${tm.name}${tm.user ? ' (you)' : ''}`, 60, y); const gb = ((lead.w - s.w) + (s.l - lead.l)) / 2; [s.w, s.l, s.t, s.pct.toFixed(3).replace(/^0/, ''), gb ? gb.toFixed(1) : '-', s.rs, s.ra].forEach((v, i) => c.fillText(String(v), 300 + i * 42, y)); if (r === 3) { c.strokeStyle = '#ffd32a'; c.setLineDash([5, 4]); c.beginPath(); c.moveTo(30, y + 21); c.lineTo(602, y + 21); c.stroke(); c.setLineDash([]); } });
  } else if (ui.tab === 'leaders') {
    seasonLeaders().forEach(([title, list, fmt], i) => { const x = 36 + (i % 2) * 290, y = 92 + Math.floor(i / 2) * 146; c.fillStyle = '#ffd32a'; c.font = `900 14px ${FONT}`; c.textAlign = 'left'; c.fillText(title, x, y); list.forEach((r, j) => { c.fillStyle = SEASON.teams[r.team].user ? '#ffeaa7' : '#fff'; c.font = `bold 12px ${FONT}`; c.fillText(`${j + 1}. ${kidById(r.id).nick} (${SEASON.teams[r.team].name.split(' ').slice(-1)[0]})`, x, y + 20 + j * 20); c.textAlign = 'right'; c.fillText(String(fmt(r.v)), x + 260, y + 20 + j * 20); c.textAlign = 'left'; }); if (!list.length) { c.fillStyle = '#ccc'; c.fillText('No games yet.', x, y + 20); } });
  } else {
    const mine = SEASON.results.filter(r => r.teams.includes(0)); c.font = `bold 13px ${FONT}`; c.textAlign = 'left';
    SEASON.schedule.forEach((pairs, i) => { const p = pairs.find(q => q.includes(0)), opp = p[0] === 0 ? p[1] : p[0], res = mine.find(r => r.round === i && !r.playoff), y = 88 + i * 31; c.fillStyle = i === SEASON.round && SEASON.phase === 'regular' ? '#ffd32a' : '#fff'; c.fillText(`${i + 1}. ${p[0] === 0 ? 'vs' : '@'} ${SEASON.teams[opp].name}`, 36, y); if (res) { const us = res.teams[0] === 0 ? res.score[0] : res.score[1], them = res.teams[0] === 0 ? res.score[1] : res.score[0]; c.fillStyle = us > them ? '#7bed9f' : us < them ? '#ff7675' : '#dfe6e9'; c.fillText(`${us > them ? 'W' : us < them ? 'L' : 'T'} ${us}-${them}`, 420, y); } });
  }
  panel(632, 62, 312, 470, 'rgba(10,30,24,0.75)');
  if (SEASON.phase === 'done') {
    const champ = SEASON.teams[SEASON.champion]; outlinedText(c, 'CHAMPIONS!', 788, 110, 32, '#ffd32a'); c.fillStyle = champ.colors[0]; rrect(c, 660, 136, 256, 40, 10); c.fill(); c.fillStyle = '#fff'; c.font = `900 17px ${FONT}`; c.textAlign = 'center'; c.fillText(champ.name, 788, 162);
    champ.kids.slice(0, 5).forEach((id, i) => drawKid(c, kidById(id), 680 + i * 54, 290, 14, { pose: 'cheer', t: t + i * 150 }));
    c.fillStyle = '#fff'; c.font = `14px ${FONT}`; c.fillText(champ.user ? 'You won the whole thing!' : 'Better luck next season!', 788, 330);
  } else {
    const pair = currentUserGame();
    c.fillStyle = '#ffd32a'; c.font = `900 16px ${FONT}`; c.textAlign = 'center'; c.fillText(pair ? 'NEXT GAME' : 'YOUR TEAM IS OUT', 788, 96);
    if (pair) { const opp = pair[0] === 0 ? pair[1] : pair[0], home = pair[0] === 0; c.fillStyle = '#fff'; c.font = `bold 15px ${FONT}`; c.fillText(`${home ? 'vs.' : 'at'} ${SEASON.teams[opp].name}`, 788, 124); c.font = `13px ${FONT}`; c.fillStyle = '#dfe6e9'; c.fillText(FIELDS[SEASON.teams[pair[0]].field].name, 788, 146); SEASON.teams[opp].kids.slice(0, 5).forEach((id, i) => drawKid(c, kidById(id), 690 + i * 48, 236, 13, { t: t + i * 400 })); }
    else c.fillText('Watch the rest of the playoffs.', 788, 124);
    if (SEASON.phase === 'playoffs') { const pl = SEASON.playoff; c.fillStyle = '#fff'; c.font = `bold 12px ${FONT}`; c.textAlign = 'left'; pl.semis.forEach((s, i) => c.fillText(`Semi ${i + 1}: ${SEASON.teams[s[0]].name} vs ${SEASON.teams[s[1]].name}${pl.winners[i] != null ? ' → ' + SEASON.teams[pl.winners[i]].name.split(' ').slice(-1)[0] : ''}`, 650, 280 + i * 20)); if (pl.final) c.fillText(`Final: ${SEASON.teams[pl.final[0]].name} vs ${SEASON.teams[pl.final[1]].name}`, 650, 322); }
    if (pair) button(660, 350, 256, 52, 'Play Game', () => seasonPlayNext(), { color: '#ff6b6b', size: 20 });
    button(660, pair ? 412 : 350, 256, 44, pair ? 'Simulate Game' : 'Simulate next', () => seasonSimNext(), { color: '#576574', size: 15 });
  }
  button(660, 470, 120, 44, 'Menu', () => { screen = 'title'; }, { color: '#576574', size: 15 });
  button(796, 470, 120, 44, 'New Season', () => { if (window.confirm ? true : true) { storageDel(SEASON_KEY); SEASON = null; SETUP.mode = 'season'; screen = 'setup'; } }, { color: '#e17055', size: 13 });
  c.fillStyle = 'rgba(255,255,255,0.7)'; c.font = `11px ${FONT}`; c.textAlign = 'left'; c.fillText('Season progress saves on this device.', 20, H - 12);
}


/* the library bridge: the site chat can ask this module to open an online room and invite people */
function tlPostRoom(code) { try { if (window.parent !== window) window.parent.postMessage({ type: 'tl-room', code }, location.origin); } catch (e) { /* standalone */ } }
window.addEventListener('message', e => { if (e.origin !== location.origin || !e.data || e.data.type !== 'tl-host') return; if (NET.role === 'host' && NET.code && NET.peer && NET.peer.open) { tlPostRoom(NET.code); return; } screen = 'online'; netHost(); });
/* =====================================================================
   BOOT
   ===================================================================== */
(function boot() {
  const params = new URLSearchParams(location.search);
  if (params.get('room')) { ui.joinCode = params.get('room').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6); screen = 'online'; if (ui.joinCode.length === 6) setTimeout(() => netJoin(ui.joinCode), 300); }
  if (params.get('autoplay')) {
    const ids = shuffle(ROSTER.map(k => k.id));
    SETUP.field = (+params.get('field') || 0) % FIELDS.length;
    const teams = [makeTeam('Elm Ave. Eagles', TEAM_COLORS[1], ids.slice(0, 9), 'cpu'), makeTeam('Maple St. Mudcats', TEAM_COLORS[0], ids.slice(9, 18), 'cpu')];
    startGame(newGame({ mode: 'watch', field: SETUP.field, innings: +params.get('innings') || 3, diff: 'pro', seed: +params.get('seed') || 7, teams }));
  }
  requestAnimationFrame(frame);
})();

window.__sandlot = { get G() { return G; }, get P() { return P; }, get screen() { return screen; }, get NET() { return NET; }, get DRAFT() { return DRAFT; } };
