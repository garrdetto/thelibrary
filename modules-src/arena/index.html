<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Vector Arena · the library</title>
    <style>
      html,body{margin:0;height:100%;background:#05070f;color:#e9effc;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
      #stage{position:relative;width:100%;height:100%}
      #stage canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
      #hud{position:absolute;left:16px;top:14px;pointer-events:none;text-shadow:0 1px 3px #000}
      #hud h1{margin:0;font-size:18px;letter-spacing:.12em;text-transform:uppercase;color:#7ff0ff}
      #hud p{margin:4px 0 0;font-size:13px;opacity:.85}
      #status{position:absolute;right:16px;top:14px;font-size:12px;opacity:.8;pointer-events:none}
      #crosshair{--gap:6px;position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;opacity:0;transition:opacity .2s}
      #crosshair i{position:absolute;background:#7ff0ff;box-shadow:0 0 6px #38e1ff}
      #crosshair i:nth-child(1),#crosshair i:nth-child(2){width:2px;height:8px;left:-1px}
      #crosshair i:nth-child(3),#crosshair i:nth-child(4){height:2px;width:8px;top:-1px}
      #crosshair i:nth-child(1){bottom:var(--gap)}
      #crosshair i:nth-child(2){top:var(--gap)}
      #crosshair i:nth-child(3){right:var(--gap)}
      #crosshair i:nth-child(4){left:var(--gap)}
      body.locked #crosshair{opacity:.9}
      body.dead #crosshair{opacity:0}
      #hitmarker{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;pointer-events:none;opacity:0}
      #hitmarker::before,#hitmarker::after{content:"";position:absolute;left:10px;top:0;width:2px;height:22px;background:#fff;transform:rotate(45deg);box-shadow:0 0 4px #000}
      #hitmarker::after{transform:rotate(-45deg)}
      #hitmarker.show{opacity:1}
      #hitmarker.head::before,#hitmarker.head::after{background:#ffd34d}
      #hitmarker.kill::before,#hitmarker.kill::after{background:#ff5a5a}
      #damage{position:absolute;inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 140px rgba(255,40,40,.75);transition:opacity .2s}
      #damage.show{opacity:1;transition:none}
      #vitals{position:absolute;left:16px;bottom:18px;width:220px;pointer-events:none;text-shadow:0 1px 3px #000}
      #vitals .label{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
      .bar{height:8px;margin-top:4px;background:rgba(5,10,24,.7);border:1px solid rgba(127,240,255,.35);border-radius:4px;overflow:hidden}
      .bar div{height:100%;transform-origin:left center;background:linear-gradient(90deg,#38e1ff,#7ff0ff)}
      .bar div.low{background:linear-gradient(90deg,#ff4d4d,#ff8a5a)}
      #arsenal{position:absolute;right:16px;bottom:18px;min-width:200px;text-align:right;pointer-events:none;text-shadow:0 1px 3px #000}
      #weapon-name{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#7ff0ff}
      #weapon-ammo{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
      #weapon-ammo.low{color:#ff8a5a}
      #arsenal .bar div{transform:scaleX(0)}
      #arsenal small{display:block;font-size:11px;opacity:.7;margin-top:4px}
      #killfeed{position:absolute;right:16px;top:40px;font-size:13px;text-align:right;pointer-events:none}
      #killfeed div{background:rgba(5,10,24,.65);padding:4px 8px;border-radius:6px;margin-top:4px}
      #dead{position:absolute;inset:0;display:none;place-items:center;font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:#ff8a8a;background:rgba(40,0,0,.35);pointer-events:none}
      #dead.show{display:grid}
      #prompt{position:absolute;inset:auto 0 28px 0;text-align:center;font-size:14px;pointer-events:none}
      #prompt span{background:rgba(5,10,24,.72);border:1px solid rgba(127,240,255,.35);padding:8px 14px;border-radius:8px}
      body.locked #prompt{display:none}
      #error{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:24px}
      @media (prefers-reduced-motion: reduce){#crosshair,#damage{transition:none}}
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="hud"><h1>Vector Arena</h1><p>WASD move · Mouse look · Space jump · Shift sprint</p><p>Click fire · 1 / 2, Q or wheel switch · R reload</p></div>
      <div id="status" aria-live="polite"></div>
      <div id="crosshair" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div id="hitmarker" aria-hidden="true"></div>
      <div id="damage" aria-hidden="true"></div>
      <div id="killfeed" aria-live="polite"></div>
      <div id="vitals"><div class="label"><span>Health</span><span id="health-text">100</span></div><div class="bar"><div id="health-fill"></div></div></div>
      <div id="arsenal"><div id="weapon-name">Assault Rifle</div><div id="weapon-ammo">32 / 32</div><div class="bar"><div id="weapon-reload"></div></div><small>1 Assault Rifle · 2 Battle Rifle</small></div>
      <div id="dead" role="status"></div>
      <div id="prompt"><span>Click the arena to look around · Esc releases the mouse</span></div>
      <div id="error" role="alert"></div>
    </div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
